<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - SkillSwap</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222;
        }

        nav {
            padding: 20px 60px;
            background-color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
        }

        .login-container {
            width: 400px;
            margin: 100px auto;
            background-color: white;
            padding: 40px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #555;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .options a {
            color: #222;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-text {
            text-align: center;
            margin-top: 20px;
        }

        .signup-text a {
            color: #222;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">SkillSwap</a>
    </nav>

    <div class="login-container">

        <h1>Log In</h1>
        <p class="subtitle">Welcome back to SkillSwap.</p>

        <form>

            <label for="email">WSU Email</label>
            <input type="email" id="email" placeholder="Enter your WSU email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <div class="options">

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <a href="#">Forgot password?</a>

            </div>

            <button type="submit">Log In</button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="create-account.html">Create Account</a>
        </p>

    </div>

</body>
</html>
