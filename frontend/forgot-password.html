<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>
    </nav>

    <div class="login-container">
        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your WSU email and we'll help you reset your password.
        </p>

        <form>
            <label for="email">WSU Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="name@wayne.edu"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <p class="signup-text">
            Remember your password?
            <a href="login.html">Back to Log In</a>
        </p>
    </div>

</body>
</html>
