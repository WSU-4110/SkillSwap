
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="modern-edit-page">

    <nav>
        <a href="home.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
            <a href="home.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="profile.html">My Profile</a>
            <a href="messages.html">Messages</a>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="edit-profile-container">

        <header class="edit-page-heading">
            <h1>Edit Your Profile</h1>
            <p>Update your information and manage your skills.</p>
        </header>

        <form id="edit-profile-form">

            <section class="edit-personal-card">

                <h2>Personal Information</h2>

                <div class="profile-fields">

                    <div>
                        <label for="name">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                        >
                    </div>

                    <div>
                        <label for="major">Major</label>
                        <input
                            type="text"
                            id="major"
                            placeholder="Enter your major"
                        >
                    </div>

                </div>

                <label for="bio">Bio</label>
                <textarea
                    id="bio"
                    placeholder="Tell us about yourself"
                ></textarea>

                <label for="photo">Change Photo</label>
                <input
                    type="file"
                    id="photo"
                    accept="image/*"
                >

            </section>

            <div class="edit-skills">

                <section class="edit-skills-box">

                    <h2>Skills I Can Teach</h2>

                    <div class="add-skill">
                        <input
                            type="text"
                            id="teach-input"
                            placeholder="Add a skill..."
                        >
                        <button type="button" id="add-teach">
                            Add
                        </button>
                    </div>

                    <ul id="teach-list"></ul>

                </section>

                <section class="edit-skills-box">

                    <h2>Skills I Want to Learn</h2>

                    <div class="add-skill">
                        <input
                            type="text"
                            id="learn-input"
                            placeholder="Add a skill..."
                        >
                        <button type="button" id="add-learn">
                            Add
                        </button>
                    </div>

                    <ul id="learn-list"></ul>

                </section>

            </div>

            <p
                id="profile-message"
                role="status"
                aria-live="polite"
            ></p>

            <div class="profile-buttons">
                <a href="profile.html" class="cancel-button">
                    Cancel
                </a>

                <button type="submit" class="save-button">
                    Save Changes
                </button>
            </div>

        </form>

    </main>

    <script src="js/profile.js"></script>

    <script>
        document.getElementById('logout-btn')
            .addEventListener('click', async () => {

                const button = document.getElementById('logout-btn');
                button.disabled = true;

                try {
                    const response = await fetch(
                        'http://localhost:3000/api/logout',
                        {
                            method: 'POST',
                            credentials: 'include'
                        }
                    );

                    if (!response.ok) {
                        throw new Error('Logout failed');
                    }

                    window.location.replace('login.html');

                } catch (error) {
                    alert('Could not log out. Please try again.');
                    button.disabled = false;
                }
            });
    </script>

</body>
</html>
