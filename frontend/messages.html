
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="modern-messages-page">

    <nav>
        <a href="home.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
            <a href="home.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="profile.html">My Profile</a>
            <a href="messages.html" aria-current="page">Messages</a>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="profile-page">

        <a href="browse.html" class="back-browse-button">
            ← Back to Browse
        </a>

        <section class="profile-bio">
            <h1>Messages</h1>

            <div
                id="messages-loading"
                class="dashboard-loading"
                role="status"
                aria-live="polite"
            >
                <span
                    class="loading-spinner"
                    aria-hidden="true"
                ></span>
                <span>Loading conversation...</span>
            </div>

            <p id="conversation-name"></p>

            <p
                id="conversation-status"
                role="status"
                aria-live="polite"
            ></p>
        </section>

        <section
            id="conversation-content"
            class="profile-bio"
            hidden
        >

            <h2>Conversation</h2>

            <div
                id="message-list"
                class="message-list"
            ></div>

            <form id="message-form">

                <label for="message-input">
                    Your Message
                </label>

                <textarea
                    id="message-input"
                    placeholder="Type your message..."
                    required
                ></textarea>

                <button type="submit" class="save-button">
                    Send Message
                </button>

            </form>

            <p
                id="message-status"
                role="status"
                aria-live="polite"
            ></p>

        </section>

    </main>

    <script src="js/messages.js"></script>

    <script>
        document.getElementById('logout-btn')
            .addEventListener('click', async () => {

                const button = document.getElementById('logout-btn');
                button.disabled = true;

                try {
                    const response = await fetch(
                        'http://localhost:3000/api/logout',
                        {
                            method: 'POST',
                            credentials: 'include'
                        }
                    );

                    if (!response.ok) {
                        throw new Error('Logout failed');
                    }

                    window.location.replace('login.html');

                } catch (error) {
                    alert('Could not log out. Please try again.');
                    button.disabled = false;
                }
            });
    </script>

</body>
</html>
