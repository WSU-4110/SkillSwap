
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
<style id="global-unread-badge-style">
.nav-buttons a[href="messages.html"] {
    position: relative;
}
.global-unread-badge {
    position: absolute;
    top: -13px;
    right: -17px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 999px;
    background: #e5242b;
    color: white;
    font-size: 12px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    box-sizing: border-box;
}
.global-unread-badge[hidden] {
    display: none !important;
}
</style>
</head>

<body class="browse-page">

    <nav>
        <a href="home.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
            <a href="home.html">Home</a>
            <a href="browse.html" aria-current="page">Browse</a>
            <a href="profile.html">My Profile</a>
            <a href="requests.html">Requests</a>
            <a href="messages.html">Messages<span id="global-message-badge" class="global-unread-badge" hidden></span></a>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="profile-page">

        <section class="profile-bio">
            <h1>Browse Students</h1>
            <p>Find students who can teach skills you want to learn.</p>
        </section>

        <section class="profile-bio">
            <h2>Search Students by Skill</h2>
            <p>Find students who can teach a skill.</p>

            <form id="search-form">
                <input
                    type="text"
                    id="skill-search"
                    placeholder="Enter a skill (e.g., Python)"
                    aria-label="Search by skill"
                    required
                >

                <button type="submit">Search</button>
            </form>

            <p
                id="search-status"
                role="status"
                aria-live="polite"
            ></p>

            <div id="search-results"></div>
        </section>

        <section
            class="profile-bio"
            aria-labelledby="suggested-heading"
        >
            <h2 id="suggested-heading">Suggested Students</h2>

            <!-- NFR-5: Suggestions Loading Indicator -->
            <div
                id="suggestions-loading"
                class="dashboard-loading"
                role="status"
                aria-live="polite"
            >
                <span
                    class="loading-spinner"
                    aria-hidden="true"
                ></span>
                <span>Loading suggestions...</span>
            </div>

            <p
                id="suggestions-status"
                role="status"
                aria-live="polite"
            ></p>

            <div id="suggested-users"></div>
        </section>

        <section
            class="profile-bio"
            aria-labelledby="all-heading"
        >
            <h2 id="all-heading">All Students</h2>

            <!-- NFR-5: Students Loading Indicator -->
            <div
                id="browse-loading"
                class="dashboard-loading"
                role="status"
                aria-live="polite"
            >
                <span
                    class="loading-spinner"
                    aria-hidden="true"
                ></span>
                <span>Loading students...</span>
            </div>

            <p
                id="browse-status"
                role="status"
                aria-live="polite"
            ></p>

            <div id="all-users"></div>
        </section>

    </main>

    <script src="js/browse.js"></script>

    <script>
        // Log out using the existing backend session.
        document.getElementById('logout-btn')
            .addEventListener('click', async () => {

                const button = document.getElementById('logout-btn');
                button.disabled = true;

                try {
                    const response = await fetch(
                        'http://localhost:3000/api/logout',
                        {
                            method: 'POST',
                            credentials: 'include'
                        }
                    );

                    if (!response.ok) {
                        throw new Error('Logout failed');
                    }

                    window.location.replace('login.html');

                } catch (error) {
                    alert('Could not log out. Please try again.');
                    button.disabled = false;
                }
            });
    </script>

    <script src="js/message-notifications.js"></script>
</body>
</html>
