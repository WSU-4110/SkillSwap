<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
<style id="global-unread-badge-style">
.nav-buttons a[href="messages.html"] {
    position: relative;
}
.global-unread-badge {
    position: absolute;
    top: -13px;
    right: -17px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 999px;
    background: #e5242b;
    color: white;
    font-size: 12px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    box-sizing: border-box;
}
.global-unread-badge[hidden] {
    display: none !important;
}
</style>
</head>
<body>
    <nav>
        <a href="home.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
    <a href="home.html">Home</a>
    <a href="browse.html">Browse</a>
    <a href="profile.html">My Profile</a>
    <a href="requests.html">Requests</a>
    <a href="messages.html">Messages<span id="global-message-badge" class="global-unread-badge" hidden></span></a>
    <button type="button" id="logout-btn">Log Out</button>
</div>
    </nav>

    <main class="profile-page">
        <a href="browse.html" class="back-browse-button">← Back to Browse</a>

        <p id="user-profile-status" role="status" aria-live="polite">
            Loading profile...
        </p>

        <div id="user-profile-content" hidden>
            <section class="profile-header">
                <img
    id="user-profile-image"
    alt="Student profile picture"
    width="120"
    height="120"
    style="object-fit: cover; border-radius: 50%;"
    hidden
>
                <div class="profile-info">
                    <h1 id="user-name"></h1>
                    <p>Wayne State University</p>
                    <p id="user-major"></p>
                </div>
                <a id="message-user-button"
                    href="#"
                    class="edit-button"
                    hidden>
                    Message User
                </a>

            <div class="swap-request-actions">
                <button
                    type="button"
                    id="send-request-button"
                    class="swap-request-button"
                    hidden>
                    Send Swap Request
                </button>

                <p
                    id="request-status"
                    class="swap-request-status"
                    role="status"
                    aria-live="polite">
                </p>
            </div>

            </section>

            <section class="profile-bio">
                <h2>About</h2>
                <p id="user-bio"></p>
            </section>

            <div class="profile-skills">
                <section class="skills-box">
                    <h2>Skills They Can Teach</h2>
                    <ul id="user-teach-skills"></ul>
                </section>

                <section class="skills-box">
                    <h2>Skills They Want to Learn</h2>
                    <ul id="user-learn-skills"></ul>
                </section>
            </div>
        </div>
    </main>

    <script src="js/user-profile.js"></script>
    <script src="js/message-notifications.js"></script>
<script>
document.getElementById("logout-btn").addEventListener("click", async () => {
    try {
        const response = await fetch("http://localhost:3000/api/logout", {
            method: "POST",
            credentials: "include"
        });

        if (!response.ok) throw new Error("Logout failed");

        window.location.href = "index.html";
    } catch (error) {
        alert("Could not log out. Please try again.");
    }
});
</script>
</body>
</html>
