
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
<style id="global-unread-badge-style">
.nav-buttons a[href="messages.html"] {
    position: relative;
}
.global-unread-badge {
    position: absolute;
    top: -13px;
    right: -17px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 999px;
    background: #e5242b;
    color: white;
    font-size: 12px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    box-sizing: border-box;
}
.global-unread-badge[hidden] {
    display: none !important;
}
</style>
</head>

<body class="modern-profile-page">

    <nav>
        <a href="home.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
            <a href="home.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="profile.html" aria-current="page">My Profile</a>
            <a href="requests.html">Requests</a>
            <a href="messages.html">Messages<span id="global-message-badge" class="global-unread-badge" hidden></span></a>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="profile-page">

        <!-- NFR-5: Profile Loading Indicator -->
        <div
            id="profile-loading"
            class="dashboard-loading"
            role="status"
            aria-live="polite"
        >
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading your profile...</span>
        </div>

        <!-- Profile Content -->
        <div id="profile-content" hidden>

            <section class="profile-header">

                <div class="profile-cover"></div>

                <div class="profile-header-content">

                    <div class="profile-avatar">
                        <img
                            id="profile-image"
                            alt="Profile picture"
                            hidden
                        >
                    </div>

                    <div class="profile-info">
                        <h1 id="profile-name">Student Name</h1>
                        <p>Wayne State University</p>
                        <p id="profile-major">Major</p>
                    </div>

                    <a href="edit-profile.html" class="edit-button">
                        Edit Profile
                    </a>

                </div>

            </section>

            <section class="profile-bio">
                <h2>About Me</h2>
                <p id="profile-bio">
                    Tell others a little about yourself.
                </p>
            </section>

            <div class="profile-skills">

                <section class="skills-box">
                    <h2>Skills I Can Teach</h2>

                    <ul id="teach-skills">
                        <li>No skills added yet.</li>
                    </ul>
                </section>

                <section class="skills-box">
                    <h2>Skills I Want to Learn</h2>

                    <ul id="learn-skills">
                        <li>No skills added yet.</li>
                    </ul>
                </section>

            </div>

        </div>

        <!-- Loading Error Message -->
        <p
            id="profile-loading-error"
            role="alert"
            hidden
        ></p>

    </main>

    <script src="js/profile.js"></script>

    <script>
        document.getElementById('logout-btn')
            .addEventListener('click', async () => {

                const button = document.getElementById('logout-btn');
                button.disabled = true;

                try {
                    const response = await fetch(
                        'http://localhost:3000/api/logout',
                        {
                            method: 'POST',
                            credentials: 'include'
                        }
                    );

                    if (!response.ok) {
                        throw new Error('Logout failed');
                    }

                    window.location.replace('login.html');

                } catch (error) {
                    alert('Could not log out. Please try again.');
                    button.disabled = false;
                }
            });
    </script>

    <script src="js/message-notifications.js"></script>
</body>
</html>
