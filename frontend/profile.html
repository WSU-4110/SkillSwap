
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="modern-profile-page">

    <nav>
        <a href="home.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
            <a href="home.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="profile.html" aria-current="page">My Profile</a>
            <a href="messages.html">Messages</a>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="profile-page">

        <section class="profile-header">

            <div class="profile-cover"></div>

            <div class="profile-header-content">

                <div class="profile-avatar">
                    <img
                        id="profile-image"
                        alt="Profile picture"
                        hidden
                    >
                </div>

                <div class="profile-info">
                    <h1 id="profile-name">Student Name</h1>
                    <p>Wayne State University</p>
                    <p id="profile-major">Major</p>
                </div>

                <a href="edit-profile.html" class="edit-button">
                    Edit Profile
                </a>

            </div>

        </section>

        <section class="profile-bio">
            <h2>About Me</h2>
            <p id="profile-bio">
                Tell others a little about yourself.
            </p>
        </section>

        <div class="profile-skills">

            <section class="skills-box">
                <h2>Skills I Can Teach</h2>

                <ul id="teach-skills">
                    <li>No skills added yet.</li>
                </ul>
            </section>

            <section class="skills-box">
                <h2>Skills I Want to Learn</h2>

                <ul id="learn-skills">
                    <li>No skills added yet.</li>
                </ul>
            </section>

        </div>

    </main>

    <script src="js/profile.js"></script>

    <script>
        document.getElementById('logout-btn')
            .addEventListener('click', async () => {

                const button = document.getElementById('logout-btn');
                button.disabled = true;

                try {
                    const response = await fetch(
                        'http://localhost:3000/api/logout',
                        {
                            method: 'POST',
                            credentials: 'include'
                        }
                    );

                    if (!response.ok) {
                        throw new Error('Logout failed');
                    }

                    window.location.replace('login.html');

                } catch (error) {
                    alert('Could not log out. Please try again.');
                    button.disabled = false;
                }
            });
    </script>

</body>
</html>
