<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="profile.html">My Profile</a>
        </div>
    </nav>

    <div class="profile-page">

        <div class="profile-header">

            <div class="profile-info">
                <h1 id="profile-name">Student Name</h1>
                <p>Wayne State University</p>
                <p id="profile-major">Major</p>
            </div>

            <a href="edit-profile.html" class="edit-button">
                Edit Profile
            </a>

        </div>

        <div class="profile-bio">
            <h2>About Me</h2>
            <p id="profile-bio">Tell others a little about yourself.</p>
        </div>

        <div class="profile-skills">

            <div class="skills-box">
                <h2>Skills I Can Teach</h2>
                <ul id="teach-skills">
                    <li>No skills added yet.</li>
                </ul>
            </div>

            <div class="skills-box">
                <h2>Skills I Want to Learn</h2>
                <ul id="learn-skills">
                    <li>No skills added yet.</li>
                </ul>
            </div>

        </div>

    </div>

    <script src="js/profile.js"></script>

</body>
</html>
