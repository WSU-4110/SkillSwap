<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SkillSwap</title>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <a href="index.html" class="logo">
    <img src="images/logo.png" alt="SkillSwap logo">
    <span>SkillSwap</span>
</a>
    </nav>

    <div class="signup-container">

        <h1>Create Account</h1>
        <p class="subtitle">Join SkillSwap and start exchanging skills.</p>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">

            <label for="email">WSU Email</label>
            <input type="email" id="email" placeholder="Enter your WSU email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password">

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm your password">

            <button type="submit">Create Account</button>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

    </div>

</body>
</html>
