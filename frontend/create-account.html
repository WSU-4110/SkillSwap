
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>
    </nav>

    <div class="signup-container">

        <h1>Create Account</h1>
        <p class="subtitle">
            Join SkillSwap and start exchanging skills.
        </p>

        <form id="create-account-form">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">WSU Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your WSU email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="8"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm your password"
                minlength="8"
                required
            >

            <button type="submit" id="signup-button">
                Create Account
            </button>

            <p id="message" role="status"></p>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

    </div>

    <script>
        // =========================
        // FR1 - CREATE ACCOUNT
        // FR19 - PROFILE ONBOARDING
        // =========================

        const form = document.getElementById('create-account-form');
        const message = document.getElementById('message');
        const signupButton = document.getElementById('signup-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword =
                document.getElementById('confirm-password').value;

            message.textContent = '';

            // Check that passwords match.
            if (password !== confirmPassword) {
                message.textContent = 'Passwords do not match.';
                return;
            }

            // Validate password length.
            if (password.length < 8) {
                message.textContent =
                    'Password must be at least 8 characters.';
                return;
            }

            signupButton.disabled = true;
            signupButton.textContent = 'Creating Account...';

            try {
                // Register the user and create their login session.
                const response = await fetch(
                    'http://localhost:3000/api/register',
                    {
                        method: 'POST',

                        // FR19: Keep the login session cookie.
                        credentials: 'include',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    message.textContent =
                        'Account created! Redirecting to your profile...';

                    form.reset();

                    // FR19: Send new users directly to profile onboarding.
                    window.location.href =
                        'edit-profile.html?onboarding=1';

                    return;
                }

                // Display registration errors.
                message.textContent =
                    data.message || 'Could not create account.';

            } catch (error) {
                console.error('Registration error:', error);

                message.textContent =
                    'Could not connect to the server. Please try again.';

            } finally {
                signupButton.disabled = false;
                signupButton.textContent = 'Create Account';
            }
        });
    </script>

</body>
</html>
