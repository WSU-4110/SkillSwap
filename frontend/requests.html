
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap Requests | SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
<style id="global-unread-badge-style">
.nav-buttons a[href="messages.html"] {
    position: relative;
}
.global-unread-badge {
    position: absolute;
    top: -13px;
    right: -17px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 999px;
    background: #e5242b;
    color: white;
    font-size: 12px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    box-sizing: border-box;
}
.global-unread-badge[hidden] {
    display: none !important;
}
</style>
</head>

<body class="dashboard-page">

    <!-- Navigation -->
    <nav>
        <a href="home.html" class="logo">
            <img src="images/logo.png" alt="SkillSwap logo">
            <span>SkillSwap</span>
        </a>

        <div class="nav-buttons">
            <a href="home.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="profile.html">My Profile</a>
            <a href="requests.html" aria-current="page">Requests</a>
            <a href="messages.html">Messages<span id="global-message-badge" class="global-unread-badge" hidden></span></a>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="dashboard-main">

        <section class="dashboard-welcome">
            <span class="dashboard-label">
                SKILLSWAP REQUESTS
            </span>

            <h1>Swap Requests</h1>

            <p>
                View requests from other students
                and accept the ones you're interested in.
            </p>
        </section>

        <section class="dashboard-actions">
            <div class="dashboard-section-heading">
                <h2>Incoming Requests</h2>
                <p>Students who want to swap skills with you.</p>
            </div>

            <div id="incoming-requests" class="requests-list">
                <!-- Requests will be loaded here -->
            </div>

            <p id="requests-status"
               role="status"
               aria-live="polite">
                Loading requests...
            </p>

            <button id="load-more-requests"
                    type="button"
                    hidden>
                Load More
            </button>
        </section>

    </main>

    <script src="js/requests.js" defer></script>

<script>
document.getElementById('logout-btn').addEventListener('click', async () => {
    const button = document.getElementById('logout-btn');
    button.disabled = true;

    try {
        const response = await fetch('http://localhost:3000/api/logout', {
            method: 'POST',
            credentials: 'include'
        });

        if (!response.ok) throw new Error('Logout failed');

        window.location.replace('login.html');
    } catch (error) {
        alert('Could not log out. Please try again.');
        button.disabled = false;
    }
});
</script>
    <script src="js/message-notifications.js"></script>
</body>
</html>
